version: '3.8'

services:
  inss-api:
    build: .
    container_name: inss-api-service
    ports:
      - "127.0.0.1:9696:9696"  # Доступен только локально для nginx на хосте
    restart: unless-stopped
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9696/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
